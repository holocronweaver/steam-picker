[project]
name = "steam-picker"
version = "0.1.6"
description = "Pick a random game from your personal Steam library!"
authors = [{ name = "Jesse Johnson", email = "1024369+holocronweaver@users.noreply.github.com" }]
requires-python = ">=3.10, <4"
readme = "README.md"
license = "MPL-2.0"
dependencies = [
    "appdirs>=1.4.4,<2",
    "PyYAML~=6.0",
    "requests>=2.31.0,<3",
    "setuptools>=83.0.0,<84",
    "steam>=1.4.3,<2",
]

[project.scripts]
steam-picker = "steampicker.steampicker:run"

[dependency-groups]
dev = []

[tool.hatch.build.targets.sdist]
include = ["steampicker"]

[tool.hatch.build.targets.wheel]
include = ["steampicker"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
