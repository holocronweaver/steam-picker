[project]
name = "steam-picker"
version = "0.1.7"
description = "Pick a random game from your personal Steam library!"
authors = [{ name = "Jesse Johnson", email = "1024369+holocronweaver@users.noreply.github.com" }]
requires-python = ">=3.10, <4"
readme = "README.md"
license = "MPL-2.0"
keywords = ["steam", "games", "random", "picker", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "appdirs>=1.4.4,<2",
    "PyYAML~=6.0",
    "requests>=2.31.0,<3",
    "steam>=1.4.3,<2",
]

[project.urls]
Homepage = "https://github.com/holocronweaver/steam-picker"
Repository = "https://github.com/holocronweaver/steam-picker"
Issues = "https://github.com/holocronweaver/steam-picker/issues"

[project.scripts]
steam-picker = "steampicker.steampicker:run"

[dependency-groups]
dev = []

[tool.hatch.build.targets.sdist]
include = ["steampicker"]

[tool.hatch.build.targets.wheel]
include = ["steampicker"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
